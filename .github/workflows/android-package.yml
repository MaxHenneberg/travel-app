name: Android package

on:
  pull_request:
    paths:
      - android/**
      - src/features/compat/runtime.ts
      - src/lib/pending-import.*
      - src/lib/trailbook-import.*
      - tests/integration/android-package.spec.js
      - scripts/check-android-package.mjs
      - .github/workflows/android-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:android

  debug-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install the pinned Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Test, lint, and assemble the debug-signed test package
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: trailbook-android-debug-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
